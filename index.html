<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Ми в Viber ☺️</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "Montserrat", Arial, sans-serif;
    color: #1d1d1d;
    min-height: 100vh;
    background-color: #f8f7f7;
    /* ледь помітна сітка на фоні */
    background-image:
      linear-gradient(#efeded 1px, transparent 1px),
      linear-gradient(90deg, #efeded 1px, transparent 1px);
    background-size: 120px 120px;
    overflow-x: hidden;
  }

  /* великі тонкі кола на фоні */
  .ring {
    position: fixed;
    border: 1px solid #ebe8e8;
    border-radius: 50%;
    pointer-events: none;
    z-index: 0;
  }
  .ring.r1 { width: 560px; height: 560px; top: 180px; left: -330px; }
  .ring.r2 { width: 640px; height: 640px; top: 420px; right: -420px; }

  .page {
    position: relative;
    z-index: 1;
    max-width: 480px;
    margin: 0 auto;
    padding: 48px 22px 80px;
  }

  /* ===== Картка-інструкція ===== */
  .notice {
    background: #fff;
    border: 2px solid #3a3a3a;
    border-radius: 18px;
    box-shadow: 0 7px 0 #dcdcdc;
    padding: 40px 22px 38px;
    font-size: 16px;
    line-height: 1.45;
  }
  .notice p + p { margin-top: 20px; }
  .notice b { font-weight: 700; }
  .notice a { color: inherit; text-decoration: none; }

  /* ===== Чорна лінія-розділювач ===== */
  .divider {
    height: 4px;
    background: #111;
    margin: 58px 0 50px;
  }

  h2 {
    text-align: center;
    font-size: 19px;
    font-weight: 700;
    margin-bottom: 20px;
  }

  /* ===== Рожеві кнопки ===== */
  .btn {
    display: flex;
    align-items: center;
    gap: 16px;
    min-height: 74px;
    padding: 10px 16px;
    margin-bottom: 24px;
    background: #f3e3e3;
    border-radius: 16px;
    box-shadow: 0 8px 0 #d6cbcb;
    color: #6a6a6a;
    font-size: 17px;
    text-decoration: none;
    -webkit-tap-highlight-color: transparent;
    transition: transform .1s, box-shadow .1s;
  }
  .btn:active {
    transform: translateY(5px);
    box-shadow: 0 3px 0 #d6cbcb;
  }

  .icon {
    width: 52px;
    height: 52px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .icon.round { background: #67684f; border-radius: 50%; }

  .label { flex: 1; }

  .dots { display: flex; flex-direction: column; gap: 3px; }
  .dots i { width: 4px; height: 4px; border-radius: 50%; background: #8a8a8a; display: block; }

  /* ===== Кнопка "скопіювати номер" ===== */
  .phone-row { display: inline-flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .copy-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 36px; height: 36px;
    border: 1.5px solid #67684f; border-radius: 10px;
    background: #f3e3e3; color: #67684f;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .copy-btn:active { transform: scale(0.92); }
  .copied { font-size: 13px; color: #67684f; opacity: 0; transition: opacity .2s; }
  .copied.show { opacity: 1; }
</style>
</head>
<body>

<div class="ring r1"></div>
<div class="ring r2"></div>

<main class="page">

  <!-- ================= КАРТКА З ІНСТРУКЦІЄЮ ================= -->
  <section class="notice">
    <p><b>Переходьте з готовим скріном!</b> ☺️</p>
    <p>
      Номер для швидкого зв'язку у Viber 👇<br>
      <span class="phone-row">
        <a href="viber://chat?number=%2B380636004603">+380636004603</a>
        <button class="copy-btn" type="button" onclick="copyPhone(this)" aria-label="Скопіювати номер">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="12" height="12" rx="2"/>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
          </svg>
        </button>
        <span class="copied">Скопійовано ✓</span>
      </span>
    </p>
  </section>

  <div class="divider"></div>

  <!-- ================= АСОРТИМЕНТ ТОВАРУ ================= -->
  <h2>Асортимент товару</h2>

  <!-- Viber -->
  <a class="btn" href="viber://chat?number=%2B380636004603">
    <div class="icon">
      <svg width="50" height="50" viewBox="0 0 50 50" fill="none" stroke="#67684f" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M25 4C12.5 4 6 9.5 6 21.5c0 7.5 3 12 7.5 14.2V45l7.8-7h3.7C37.5 38 44 32.5 44 21.5S37.5 4 25 4z"/>
        <path d="M17.6 14.2c1-.9 2.3-.8 3 .2l2.1 3c.6.9.4 2-.5 2.6l-.8.6c.6 2 2.6 4.4 5 5.4l.6-.8c.6-.9 1.8-1.1 2.6-.5l3 2.1c1 .7 1.1 2 .2 3-1.5 1.7-3.3 2.4-5.6 1.6-4.4-1.6-8.6-5.8-10.2-10.2-.8-2.3-.1-4.2 1.6-5z" fill="#67684f" stroke-width="1.5"/>
        <path d="M26.5 11.5c3.8.4 6.6 3.2 7 7"/>
        <path d="M26.5 16c1.6.3 2.7 1.3 3 3"/>
      </svg>
    </div>
    <span class="label">Ми в Viber ☺️</span>
    <span class="dots"><i></i><i></i><i></i></span>
  </a>

</main>
<script>
  function copyPhone(btn) {
    var number = '+380636004603';
    var done = function () {
      var msg = btn.nextElementSibling;
      msg.classList.add('show');
      setTimeout(function () { msg.classList.remove('show'); }, 2000);
    };
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(number).then(done, function () { fallback(number); done(); });
    } else { fallback(number); done(); }
  }
  function fallback(text) {
    var t = document.createElement('textarea');
    t.value = text; t.setAttribute('readonly', '');
    t.style.position = 'absolute'; t.style.left = '-9999px';
    document.body.appendChild(t); t.select(); t.setSelectionRange(0, 99);
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(t);
  }
</script>
</body>
</html>
